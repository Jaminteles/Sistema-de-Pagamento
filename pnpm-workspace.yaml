packages:
  - 'apps/*'
  - 'packages/*'

# pnpm bloqueia scripts de instalacao por padrao. Liberamos apenas os pacotes
# que realmente precisam compilar ou baixar binario (argon2, engines do Prisma,
# esbuild e resolvedores nativos). @scarf/scarf fica negado de proposito: e
# telemetria e nao e necessario para o build.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.1'
  - '@typescript-eslint/parser@8.71.1'
  - '@typescript-eslint/type-utils@8.71.1'
  - '@typescript-eslint/utils@8.71.1'
  - typescript-eslint@8.71.1
  - '@typescript-eslint/project-service@8.71.1'
  - '@typescript-eslint/scope-manager@8.71.1'
  - '@typescript-eslint/tsconfig-utils@8.71.1'
  - '@typescript-eslint/types@8.71.1'
  - '@typescript-eslint/typescript-estree@8.71.1'
  - '@typescript-eslint/visitor-keys@8.71.1'
